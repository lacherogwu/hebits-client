# Every push must carry a dist/ that matches src/, because this package is installed
# straight from GitHub as well as from npm - `exports` points into dist/, and there is no
# `prepare` script to rebuild it on the consumer's machine. A stale dist/ therefore ships
# old code to anyone installing by git ref, silently. This job rebuilds and fails if the
# result differs from what was committed, so that is caught here rather than by a user.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ must match src/
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result." >&2
            exit 1
          fi
